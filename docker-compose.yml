services:
  # ─── Database ───
  postgres:
    image: postgres:15-alpine
    container_name: icmp-db
    environment:
      POSTGRES_USER: ${DB_USER:-intel_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-intel_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-intel_admin} -d ${DB_NAME:-intel_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - icmp

  # ─── Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icmp-app
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-intel_admin}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-intel_platform}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-15m}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - CLIENT_DIST=/app/public
      - UPLOAD_DIR=/app/uploads
      - RUN_SEEDS=${RUN_SEEDS:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123!}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - icmp

volumes:
  pgdata:
  uploads:

networks:
  icmp:
    driver: bridge
