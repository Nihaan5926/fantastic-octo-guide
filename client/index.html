<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg-primary text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Cache busting: auto-reload when server is redeployed
      (function() {
        var DEPLOY_KEY = 'icmp-deploy-salt';
        var CHECK_INTERVAL = 30000; // 30 seconds
        function getCurrentSalt() {
          return window.sessionStorage.getItem(DEPLOY_KEY) || window.localStorage.getItem(DEPLOY_KEY);
        }
        function setCurrentSalt(salt) {
          window.sessionStorage.setItem(DEPLOY_KEY, salt);
          window.localStorage.setItem(DEPLOY_KEY, salt);
        }
        function checkDeploy() {
          fetch('/api/deploy-version', { cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var current = getCurrentSalt();
              if (!current) {
                setCurrentSalt(data.deploySalt);
              } else if (current !== data.deploySalt) {
                // Server was redeployed — force reload
                window.location.reload(true);
              }
            })
            .catch(function() { /* ignore errors */ });
        }
        // Check immediately on load
        setTimeout(checkDeploy, 1000);
        // Then periodically
        setInterval(checkDeploy, CHECK_INTERVAL);
      })();
    </script>
  </body>
</html>
